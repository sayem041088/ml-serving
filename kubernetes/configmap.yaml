# Runtime tuning for docker/entrypoint.sh. Changing this file rolls the
# Deployment when applied with scripts/deploy.sh (it hashes the file into a
# pod-template annotation); with plain `kubectl apply` run
# `kubectl -n ml-serving rollout restart deployment/resnet-serving`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: resnet-serving-env
data:
  # Must match the container CPU limit. TF otherwise sizes its thread pools
  # from the node's cores; measured on a 2-CPU container: 5.2 img/s with 2/2
  # versus 2.9 img/s with the defaults (CFS throttling).
  TF_INTRA_OP_PARALLELISM: "2"
  TF_INTER_OP_PARALLELISM: "2"
  REST_API_TIMEOUT_IN_MS: "30000"
  # Server-side dynamic batching (experiment 2). Off by default: on CPU a single
  # image already saturates both cores, and batching only added ~8% throughput.
  ENABLE_BATCHING: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: resnet-serving-config
data:
  monitoring.config: |
    prometheus_config {
      enable: true
      path: "/monitoring/prometheus/metrics"
    }
  batching_parameters.txt: |
    max_batch_size { value: 32 }
    batch_timeout_micros { value: 5000 }
    max_enqueued_batches { value: 100 }
    num_batch_threads { value: 2 }
