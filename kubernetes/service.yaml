apiVersion: v1
kind: Service
metadata:
  name: resnet-service
  labels:
    app: resnet-serving
spec:
  # External passthrough Network Load Balancer (L4). It balances TCP
  # connections, not HTTP requests; see RECONNECT_EVERY in locust/locustfile.py.
  type: LoadBalancer
  selector:
    app: resnet-serving
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
  # Only the REST port is exposed; gRPC (8500) stays cluster-internal.
  # To restrict callers, uncomment and list your CIDRs:
  # loadBalancerSourceRanges:
  #   - 203.0.113.0/24
