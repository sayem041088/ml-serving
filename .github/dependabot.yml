# Weekly dependency updates. Note: the TF Serving base image version is the
# TF_SERVING_VERSION build arg in docker/Dockerfile, which Dependabot cannot
# update; bump it by hand together with tensorflow in requirements-model.txt
# (the export TF version must not be newer than the server).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      tensorflow:
        patterns: ["tensorflow*"]
      python-tooling:
        patterns: ["*"]
        exclude-patterns: ["tensorflow*"]

  - package-ecosystem: docker
    directories: ["/docker"]
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: weekly
