name: Deploy

# Build -> immutable tag -> push -> deploy -> smoke test (auto-rollback on
# failure) -> optional load test.
#
# One-time setup (values come from `terraform output`):
#   Repository variables: GCP_PROJECT_ID, GCP_WIF_PROVIDER, GCP_DEPLOY_SA
#   Optional variables:   GCP_REGION (us-central1), GKE_CLUSTER (resnet-inference),
#                         GKE_ZONE (us-central1-a),
#                         SMOKE_VIA_PORT_FORWARD=1 and LOAD_TEST_RUNNER=cluster for
#                         projects whose firewall policy blocks internet ingress
#                         (see docs/DEPLOYMENT.md, "Locked-down projects")
#   Environment "production" with required reviewers, to gate deploys.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "docker/**"
      - "model/**"
      - "kubernetes/**"
      - "requirements-model.txt"
      - "scripts/deploy.sh"
      - "scripts/smoke_test.sh"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      run_load_test:
        description: "Run the staged Locust load test after deploying"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # OIDC token for Workload Identity Federation (no JSON keys)

concurrency:
  group: deploy-production
  cancel-in-progress: false # never interrupt a rollout half-way

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  CLUSTER: ${{ vars.GKE_CLUSTER || 'resnet-inference' }}
  ZONE: ${{ vars.GKE_ZONE || 'us-central1-a' }}

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    # Skipped (not failed) until the GCP repository variables are configured,
    # e.g. in forks or after the environment has been torn down.
    if: vars.GCP_WIF_PROVIDER != ''
    environment: production
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute immutable tag
        id: meta
        run: |
          repo="${REGION}-docker.pkg.dev/${PROJECT_ID}/ml-models/resnet101"
          tag="sha-${GITHUB_SHA::12}"
          {
            echo "repo=${repo}"
            echo "image=${repo}:${tag}"
            # v1.2.3 git tags additionally publish a semver tag.
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              echo "release=${repo}:${GITHUB_REF_NAME#v}"
            fi
          } >> "${GITHUB_OUTPUT}"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      # Tags are immutable in Artifact Registry, so a re-run of the same commit
      # reuses the existing image instead of failing on push.
      - name: Check for existing image
        id: exists
        run: |
          if gcloud artifacts docker images describe "${{ steps.meta.outputs.image }}" >/dev/null 2>&1; then
            echo "found=true" >> "${GITHUB_OUTPUT}"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.exists.outputs.found != 'true'
      - name: Build and push
        if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.release }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan of the pushed image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.ZONE }}

      # Applies manifests with the new image, waits for the rollout, smoke
      # tests through the load balancer, and rolls back if either fails.
      - name: Deploy
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          SMOKE_VIA_PORT_FORWARD: ${{ vars.SMOKE_VIA_PORT_FORWARD || '0' }}
        run: scripts/deploy.sh

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Post-deploy checks
        run: |
          pip install -r requirements.txt
          K8S_TESTS=1 pytest -m k8s

      - name: Rollout history
        if: always()
        run: kubectl -n ml-serving rollout history deployment/resnet-serving

  load-test:
    name: Staged load test
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'workflow_dispatch' && inputs.run_load_test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.ZONE }}
      # With LOAD_TEST_RUNNER=cluster, Locust runs on the in-VPC loadgen pool
      # (terraform: enable_loadgen_pool = true) instead of on the runner.
      - name: Build and push load-generator image
        if: vars.LOAD_TEST_RUNNER == 'cluster'
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/ml-models/loadgen:sha-${GITHUB_SHA::12}"
          # Tags are immutable: a re-run of the same commit reuses the image.
          if ! gcloud artifacts docker images describe "${image}" >/dev/null 2>&1; then
            docker build -t "${image}" -f docker/loadgen.Dockerfile .
            docker push "${image}"
          fi
          echo "LOADGEN_IMAGE=${image}" >> "${GITHUB_ENV}"
      - name: Run staged profile
        env:
          RUNNER: ${{ vars.LOAD_TEST_RUNNER || 'local' }}
        run: scripts/load_test.sh
      - name: Publish summary
        if: always()
        run: cat results/*/summary.md >> "${GITHUB_STEP_SUMMARY}" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: load-test-results
          path: results/
