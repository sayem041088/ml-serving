displayName: "ResNet serving: pods pending for 10 minutes"
severity: WARNING
duration: 600s
query: |
  sum(kube_pod_status_phase{cluster="${cluster_name}", namespace="${namespace}", phase="Pending"}) > 0
documentation: |
  Serving pods have been unschedulable for 10 minutes. Normally the cluster
  autoscaler adds a node within ~2 minutes.

  Check whether the node pool is at its maximum (${max_node_count} nodes), quota, or
  Spot capacity: `kubectl -n ${namespace} describe pod <pending pod>` and
  `kubectl get events -A --field-selector reason=NotTriggerScaleUp`.
